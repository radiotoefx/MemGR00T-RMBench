name: MemGR00T source checks

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight checks
        run: python -m pip install ruff==0.12.12

      - name: Validate project and shell metadata
        run: |
          python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"
          bash -n \
            scripts/ppu/activate_gr00t.sh \
            scripts/ppu/run_gr00t_rmbench_policy_server.sh

      - name: Lint MemGR00T core and regressions
        run: |
          ruff check \
            gr00t/model/modules/robottt.py \
            gr00t/model/gr00t_n1d7/processing_gr00t_n1d7.py \
            tests/gr00t/model/test_robottt.py \
            tests/gr00t/model/test_robottt_sequence.py \
            tests/gr00t/policy/test_policy_service.py \
            tests/gr00t/policy/test_rmbench_adapter.py

      - name: Check formatting on modified surfaces
        run: |
          ruff format --check \
            gr00t/model/gr00t_n1d7/processing_gr00t_n1d7.py \
            tests/gr00t/model/test_robottt.py \
            tests/gr00t/model/test_robottt_sequence.py \
            tests/gr00t/policy/test_rmbench_adapter.py

      - name: Compile modified Python surfaces
        run: |
          python -m compileall -q \
            gr00t/model/modules/robottt.py \
            gr00t/model/gr00t_n1d7 \
            gr00t/policy \
            tests/gr00t/model/test_robottt.py \
            tests/gr00t/model/test_robottt_sequence.py
